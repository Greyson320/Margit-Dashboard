services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: grantsdb
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d grantsdb']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - '9000:9000'   # S3 API
      - '9001:9001'   # web console
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: development
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      NODE_ENV: development
      PORT: '4000'
      DATABASE_URL: postgresql://postgres:postgres@db:5432/grantsdb
      JWT_SECRET: dev_only_change_me
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 7d
      ALLOWED_ORIGINS: http://localhost:5173
      STORAGE_PROVIDER: s3
      S3_ENDPOINT: http://minio:9000
      # The browser cannot resolve "minio", so signed URLs are rewritten to this host.
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: grant-uploads
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: 'true'
      MAX_UPLOAD_MB: '20'
      MAIL_TRANSPORT: console
    ports:
      - '4000:4000'
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules
    command: >
      sh -c "npm install &&
             npx prisma migrate deploy &&
             npx prisma generate &&
             npm run seed &&
             npm run dev"

  frontend:
    build:
      context: ./frontend
      target: development
    depends_on:
      - backend
    environment:
      VITE_PROXY_TARGET: http://backend:4000
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    command: sh -c "npm install && npm run dev"

volumes:
  db-data:
  minio-data:
  backend-node-modules:
  frontend-node-modules:
